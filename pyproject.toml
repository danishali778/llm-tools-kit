[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tools-kit"
version = "0.1.0"
description = "A Python toolkit for building safe, reusable tools for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

