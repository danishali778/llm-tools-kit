[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tools-kit"
version = "0.1.0"
description = "A Python toolkit for building safe, reusable tools for LLM agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Danish Ali" },
]
keywords = [
    "agents",
    "gemini",
    "llm",
    "pydantic",
    "tool-calling",
    "tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/danishali778/llm-tools-kit"
Repository = "https://github.com/danishali778/llm-tools-kit"
Issues = "https://github.com/danishali778/llm-tools-kit/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]
